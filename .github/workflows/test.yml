name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  diff-tests:
    name: transpiler diff tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: transpiler/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run diff tests
        run: npm test
