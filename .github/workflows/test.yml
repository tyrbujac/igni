name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  diff-tests:
    name: transpiler diff tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transpiler
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: transpiler/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run diff tests
        run: npm test

      - name: Check SYNC marker drift
        working-directory: ${{ github.workspace }}
        run: |
          (cd transpiler && npx tsx ../scripts/sync-docs.ts)
          git diff --exit-code
